<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدوات مركز تفسير</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background: #f8f9fa; color: #333; }
        h1 { color: #1a472a; border-bottom: 3px solid #2d8a4e; padding-bottom: 10px; font-size: 2rem; }
        p.desc { color: #555; margin-bottom: 25px; font-size: 1.05rem; }
        
        .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin: 20px 0; }
        
        .tool-card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); border-right: 4px solid #2d8a4e; display: flex; flex-direction: column; transition: box-shadow 0.2s; }
        .tool-card:hover { box-shadow: 0 6px 15px rgba(0,0,0,0.12); }
        .tool-card h3 { margin: 0 0 8px 0; color: #1a472a; font-size: 1.2rem; }
        .tool-card p.tool-desc { margin: 0 0 15px 0; font-size: 0.9rem; color: #666; line-height: 1.4; flex-grow: 1; }
    
        .card-inputs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1 1 45%; display: flex; flex-direction: row; }
        .input-group.full-width { flex: 1 1 100%; }
        .input-group label { height: 40px; width: 110px; text-align: center; background: #e8f5e9; color: #2d8a4e; padding: 5px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    
        .input-group input[type="text"], .input-group input[type="number"] { height: 40px; width: 175px; margin-right: 5px; padding: 5px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; transition: border-color 0.2s; }
        .input-group input[type="text"]:focus, .input-group input[type="number"]:focus { border-color: #2d8a4e; outline: none; }
    
        .tool-card button { background: #2d8a4e; color: #fff; border: none; padding: 10px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; width: 100%; }
        .tool-card button:hover { background: #1a6a3a; }
    
        #result { background: #ffffff; color: #2d3748; padding: 25px; border-radius: 8px; border: 1px solid #e2e8f0; white-space: pre-wrap; overflow-x: auto; font-size: 1.1rem; line-height: 1.8; max-height: 600px; overflow-y: auto; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); margin-top: 20px;}
        #result .error { color: #dc3545; font-weight: bold; }
        #result .success-title { color: #1a472a; font-weight: bold; margin-bottom: 10px; font-size: 1.2rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
        #result .loading { color: #0d6efd; font-style: italic; }
        
        .status-bar { background: #e9ecef; padding: 10px 15px; border-radius: 4px; margin-bottom: 15px; font-size: 0.95rem; }
        .status-bar .connected { color: #2d8a4e; font-weight: bold; }
        .status-bar .disconnected { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📖 أدوات مركز تفسير (Tafsir MCP)</h1>
    <div class="status-bar" id="statusBar">🔌 الحالة: <span class="disconnected">بانتظار تنفيذ أول عملية...</span></div>
    <p class="desc">أدخل البيانات المطلوبة في الأداة التي ترغب بها ثم اضغط على "تنفيذ".</p>

    <div class="tool-grid" id="toolGrid"></div>
    <div id="result">ستظهر النتائج النصية هنا...</div>

    <script>
        // =========================================================================
        // IMPORTANT: Change this URL to your deployed backend address before going live!
        // =========================================================================
        const API_BASE = 'http://localhost:3000'; 
        
        let clientSessionId = null;

        const TOOLS = [
            { name: 'fetch_ayah', desc: 'جلب الآية الكريمة بالرسم العثماني', args: { surah: 2, ayah: 255 } },
            { name: 'fetch_tafsir', desc: 'جلب التفسير من مصادر متعددة', args: { surah: 2, ayah: 255, sources: ['saadi','katheer'] } },
            { name: 'fetch_nuzool_reason', desc: 'جلب سبب نزول الآية مع السند والمصدر', args: { surah: 2, ayah: 255 } },
            { name: 'fetch_surah_info', desc: 'جلب نظرة عامة عن السورة وفضائلها ومقاصدها', args: { surah: 2 } },
            { name: 'get_surah_statistics', desc: 'جلب إحصائيات دقيقة لكلمات وحروف السورة', args: { surah: 2 } },
            { name: 'analyze_word', desc: 'تحليل الكلمة القرآنية (جذرها، إعرابها، ومعناها)', args: { word: 'الله' } },
            { name: 'find_root_occurrences', desc: 'البحث عن جميع مواضع ورود هذا الجذر في القرآن', args: { root: 'صبر' } },
            { name: 'get_root_stats', desc: 'جلب إحصائيات مفصلة حول تكرار الجذر ومشتقاته', args: { root: 'صبر' } },
            { name: 'get_qeraat_variants', desc: 'جلب روايات واختلافات القراءات للآية', args: { surah: 1, ayah: 1 } },
            { name: 'search_quran_text', desc: 'البحث النصي الشامل والسريع في آيات القرآن الكريم', args: { query: 'الرحمن' } },
            { name: 'search_in_tafsir', desc: 'البحث عن كلمة أو جملة داخل نصوص كتب التفسير', args: { query: 'الرحمن', source: 'saadi' } },
            { name: 'get_page_fawaed', desc: 'جلب الفوائد، اللطائف، والهدايات لصفحة معينة', args: { page: 1 } },
            { name: 'get_quran_overview', desc: 'جلب إحصائيات شاملة وعامة للقرآن الكريم كاملاً', args: {} }
        ];

        const TAFSIRS = [
            { id: 'tabary', name: 'الطبري' }, { id: 'katheer', name: 'ابن كثير' },
            { id: 'baghawy', name: 'البغوي' }, { id: 'saadi', name: 'السعدي' },
            { id: 'moyassar', name: 'الميسر' }, { id: 'mukhtasar', name: 'المختصر' }
        ];

        const UI_LABELS = {
            surah: { label: 'رقم السورة', type: 'number', min: 1, max: 114 },
            ayah: { label: 'رقم الآية', type: 'number', min: 1 },
            word: { label: 'الكلمة', type: 'text' },
            root: { label: 'الجذر اللغوي', type: 'text' },
            query: { label: 'نص البحث', type: 'text' },
            page: { label: 'رقم الصفحة', type: 'number', min: 1, max: 604 },
            sources: { label: 'التفاسير', type: 'tafsir_multiple' },
            source: { label: 'التفسير', type: 'tafsir_single' }
        };

        const grid = document.getElementById('toolGrid');
        
        function updateTafsirInput(index, key) {
            const checkboxes = document.querySelectorAll(`.tafsir-checkbox-${index}-${key}:checked`);
            const vals = Array.from(checkboxes).map(cb => cb.value);
            document.getElementById(`input-${index}-${key}`).value = vals.join(',');
        }

        TOOLS.forEach((tool, index) => {
            const card = document.createElement('div');
            card.className = 'tool-card';
            
            let inputsHtml = '<div class="card-inputs">';
            let inputCount = 0;
            
            for (const [key, value] of Object.entries(tool.args)) {
                if (!UI_LABELS[key]) continue;
                
                const fieldInfo = UI_LABELS[key];
                // const widthClass = Object.keys(tool.args).length === 1 ? 'full-width' : '';
                const widthClass = '';
                
                if (fieldInfo.type === 'tafsir_multiple' || fieldInfo.type === 'tafsir_single') {
                    let optionsHtml = `<div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-right: 115px; width: 100%;">`;
                    
                    TAFSIRS.forEach(t => {
                        if (fieldInfo.type === 'tafsir_multiple') {
                            let isSelected = Array.isArray(value) && value.includes(t.id);
                            optionsHtml += `
                                <label style="font-size: 0.8rem; display: flex; align-items: center; cursor: pointer; background: #f1f8f3; padding: 3px 8px; border-radius: 4px; border: 1px solid #cce5d3; color: #1a472a;">
                                    <input type="checkbox" value="${t.id}" class="tafsir-checkbox-${index}-${key}" ${isSelected ? 'checked' : ''} style="margin-left: 5px; cursor: pointer;" onchange="updateTafsirInput(${index}, '${key}')">
                                    ${t.name}
                                </label>`;
                        } else {
                            let isSelected = value === t.id;
                            optionsHtml += `
                                <label style="font-size: 0.8rem; display: flex; align-items: center; cursor: pointer; background: #f1f8f3; padding: 3px 8px; border-radius: 4px; border: 1px solid #cce5d3; color: #1a472a;">
                                    <input type="radio" name="radio-${index}-${key}" value="${t.id}" ${isSelected ? 'checked' : ''} style="margin-left: 5px; cursor: pointer;" onchange="document.getElementById('input-${index}-${key}').value = this.value">
                                    ${t.name}
                                </label>`;
                        }
                    });
                    optionsHtml += `</div>`;

                    inputsHtml += `
                        <div class="input-group ${widthClass}" style="flex-wrap: wrap; margin-bottom: 10px;">
                            <div style="display: flex; width: 100%;">
                                <label for="input-${index}-${key}">${fieldInfo.label}</label>
                                <input type="text" id="input-${index}-${key}" value="${Array.isArray(value) ? value.join(',') : value}" placeholder="اكتب التفاسير مفصولة بفاصلة" style="flex: 1; margin-right: 5px; width: 175px;">
                            </div>
                            ${optionsHtml}
                        </div>`;
                } else {
                    const minAttr = fieldInfo.type === 'number' && fieldInfo.min ? `min="${fieldInfo.min}"` : '';
                    const maxAttr = fieldInfo.type === 'number' && fieldInfo.max ? `max="${fieldInfo.max}"` : '';
                    
                    inputsHtml += `
                        <div class="input-group ${widthClass}">
                            <label for="input-${index}-${key}">${fieldInfo.label}</label>
                            <input type="${fieldInfo.type}" id="input-${index}-${key}" value="${value}" ${minAttr} ${maxAttr}>
                        </div>`;
                }
                inputCount++;
            }
            inputsHtml += '</div>';

            card.innerHTML = `
                <h3>${tool.name}</h3>
                <p class="tool-desc">${tool.desc}</p>
                ${inputCount > 0 ? inputsHtml : ''}
                <button onclick="executeTool(${index})">▶ تنفيذ</button>
            `;
            
            grid.appendChild(card);
        });

        // Fetches a new session ID from the proxy
        async function requireSession() {
            if (clientSessionId) return clientSessionId;
            
            const response = await fetch(`${API_BASE}/init`, { method: 'POST' });
            const data = await response.json();
            
            if (data.error) throw new Error('فشل تهيئة الجلسة: ' + data.error);
            clientSessionId = data.sessionId;
            return clientSessionId;
        }

        async function executeTool(index, isRetry = false) {
            const tool = TOOLS[index];
            const resultDiv = document.getElementById('result');
            const statusBar = document.getElementById('statusBar');
            
            let finalArgs = { ...tool.args };
            
            for (const key of Object.keys(tool.args)) {
                if (!UI_LABELS[key]) continue;
                const inputEl = document.getElementById(`input-${index}-${key}`);
                if (inputEl) {
                    if (UI_LABELS[key].type === 'tafsir_multiple') {
                        finalArgs[key] = inputEl.value.split(',').map(s => s.trim()).filter(s => s);
                    } else if (UI_LABELS[key].type === 'number') {
                        finalArgs[key] = parseInt(inputEl.value) || 1;
                    } else {
                        finalArgs[key] = inputEl.value.trim();
                    }
                }
            }
            
            resultDiv.innerHTML = `<span class="loading">⏳ جاري تشغيل [${tool.name}] ومعالجة البيانات...</span>`;
            statusBar.innerHTML = '🔌 الحالة: <span class="connected">جاري الاتصال...</span>';
            
            try {
                // Ensure we have a session before calling the tool
                const sessionId = await requireSession();

                const response = await fetch(`${API_BASE}/mcp`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-mcp-session-id': sessionId
                    },
                    body: JSON.stringify({ tool: tool.name, args: finalArgs })
                });
                
                const data = await response.json();

                // Auto-retry once if the session expired
                if (response.status === 401 || data.isSessionError) {
                    if (!isRetry) {
                        console.log('🔄 الجلسة انتهت، جاري تجديدها...');
                        clientSessionId = null;
                        return executeTool(index, true); 
                    } else {
                        throw new Error('انتهت الجلسة ولم نتمكن من تجديدها. حاول مجدداً.');
                    }
                }
                
                if (data.error) {
                    resultDiv.innerHTML = `<span class="error">❌ خطأ في النظام: ${JSON.stringify(data.error)}</span>`;
                    statusBar.innerHTML = '🔌 الحالة: <span class="disconnected">خطأ في الاتصال</span>';
                    return;
                }

                if (data.result?.isError) {
                    const errorText = data.result.content?.[0]?.text || 'حدث خطأ غير معروف أثناء تشغيل الأداة';
                    resultDiv.innerHTML = `<span class="error">❌ خطأ في الأداة: ${errorText}</span>`;
                    statusBar.innerHTML = '🔌 الحالة: <span class="disconnected">خطأ في الأداة</span>';
                    return;
                }

                let pureTextResult = '';
                if (data.result && data.result.content) {
                    pureTextResult = data.result.content
                        .filter(c => c.type === 'text')
                        .map(c => c.text)
                        .join('\n\n');
                }

                if (!pureTextResult) {
                    pureTextResult = typeof data.result === 'object' ? 
                                     JSON.stringify(data.result, null, 2) : String(data);
                }
                
                resultDiv.innerHTML = `<div class="success-title">✅ نتيجة (${tool.name}):</div><div>${escapeHtml(pureTextResult)}</div>`;
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                statusBar.innerHTML = '🔌 الحالة: <span class="connected">متصل بنجاح ✓</span>';
                
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ خطأ: ${error.message}</span>`;
                statusBar.innerHTML = '🔌 الحالة: <span class="disconnected">قطع الاتصال</span>';
            }
        }

        function escapeHtml(text) {
            return text
                 .replace(/\\r\\n/g, "")
                 .replace(/\\n/g, "<br>")
                 .replace(/\\"/g, '"');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.id.startsWith('input-')) {
                const parts = e.target.id.split('-');
                if (parts.length >= 2) {
                    executeTool(parseInt(parts[1]));
                }
            }
        });
    </script>
</body>
</html>
